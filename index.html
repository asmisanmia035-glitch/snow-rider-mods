<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Snow Rider 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="description" content="Snow Rider 3D, Snow Rider 3D Mathnook, Snow Rider 3D Unblocked">
    <meta property="og:image" content="snow-rider-3d.png" />
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script src="mod-engine.js"></script>
    <link rel="stylesheet" href="mod-menu.css">
    <script src="mod-menu.js" defer></script>
    <script>
        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/SnowRider3D-gd-1.json", { onProgress: UnityProgress, Module: { onRuntimeInitialized: function () { UnityProgress(gameInstance, "complete") } } });
    </script>
</head>

<body style="overflow:hidden; margin:0; padding:0;">
    <div class="webgl-content" style="position: absolute; width: 100%; height: 100%;">
        <div id="gameContainer" style="width: 960px; height: 600px; margin: auto"></div>
    </div>
    <dialog id="mods" aria-labelledby="mods-title">
        <header><h1 id="mods-title">Sled mods</h1><button id="close-mods" aria-label="Close mod menu">×</button></header>
        <label>God mode <input id="shield" type="checkbox"></label>
        <label>Score multiplier <select id="points"><option value="1">1×</option><option value="3">3×</option><option value="10">10×</option></select></label>
        <label>Goggles <select id="goggles"><option value="none">Clear</option><option value="sepia(.8) saturate(1.5)">Amber</option><option value="hue-rotate(105deg) saturate(1.6)">Aurora</option></select></label>
        <footer><output id="saves">Loading game…</output><kbd>R</kbd></footer>
    </dialog>
</body>

</html>
